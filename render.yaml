# Documentation: https://render.com/docs/blueprint-spec
# =========================================================================

services:
  - type: web
    name: ddevguru
    runtime: static
    buildCommand: rm -f package-lock.json && npm install --include=optional && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false

    # Single Page Application (SPA) routing - redirects all routes to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Performance & Security Headers
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    # Environment Variables for Build & Runtime
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyCiNT_3w98dp0ZVRj3dgiJDvQ4fm03mplk
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: ddevguru-portfolio.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: ddevguru-portfolio
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: ddevguru-portfolio.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "849774852904"
      - key: VITE_FIREBASE_APP_ID
        value: 1:849774852904:web:e5fb125c6b9548fb5dae1d
      - key: VITE_FIREBASE_MEASUREMENT_ID
        value: G-QJC9PVTXJP

